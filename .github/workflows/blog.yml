name: Blog

# Publication entièrement automatique : mardi et jeudi à 07h00 Paris, un article
# est rédigé, contrôlé et mis en ligne sans intervention.
#
# Un push sur content/ ou sur les outils régénère simplement le rendu, sans
# écrire de nouvel article — c'est ce qui permet de corriger un article à la
# main ou de changer le design du blog.

on:
  schedule:
    - cron: '0 5 * * 2,4'    # 07h00 Paris (heure d'été) — rédaction + publication
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
      - 'assets/css/blog.css'
  workflow_dispatch:
    inputs:
      ecrire:
        description: "Rédiger un nouvel article (sinon, régénère seulement le rendu)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install --no-audit --no-fund

      - name: Vérifications (schémas, contrôle qualité, plan)
        run: node tools/check.mjs

      - name: Rédiger l'article du jour
        if: github.event_name == 'schedule' || inputs.ecrire
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/write-article.mjs

      - name: Publier
        run: |
          set -e
          git config user.name  "edgio-blog-bot"
          git config user.email "contact@edgio.fr"

          # Seul content/ est réellement produit ; blog/ et sitemap.xml en dérivent.
          # On commit d'abord le contenu (fichiers neufs, donc jamais en conflit),
          # on se synchronise, et on régénère le rendu par-dessus la base à jour.
          # Générer avant de se synchroniser faisait diverger deux runs sur les
          # mêmes fichiers générés.
          git add content
          if git diff --cached --quiet; then
            echo "Aucun nouvel article."
          else
            git commit -m "Blog : nouvel article"
          fi

          git pull --rebase --autostash origin main

          node tools/build-blog.mjs

          git add blog sitemap.xml
          if git diff --cached --quiet; then
            echo "Rendu déjà à jour."
          else
            git commit -m "Blog : régénération du rendu"
          fi

          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push
          else
            echo "Rien à pousser."
          fi
